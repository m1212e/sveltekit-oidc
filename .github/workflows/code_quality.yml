name: Code quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun i --frozen-lockfile
      - name: Run Linter
        run: bun run lint
